name: Publish Python package to PyPI

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_target:
        description: Distribution to publish
        type: choice
        options:
          - development
          - release
        default: development
        required: true
      release_tag:
        description: Existing tag to publish when target is release (for example, 1.2.0)
        type: string
        required: false

jobs:
  pypi-publish-dev:
    name: Publish dev release to PyPI
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'development')
    runs-on: ubuntu-latest
    environment:
      name: pypi-dev
      url: https://pypi.org/p/terndata.ecoplots
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build packaging setuptools wheel
      - name: Set dev version
        run: |
          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)"
          BASE_VERSION="${LATEST_TAG#v}"
          DEV_VERSION="$(python .github/workflows/scripts/next_dev_version.py "$BASE_VERSION" "$GITHUB_RUN_NUMBER")"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"
          echo "Building terndata.ecoplots $DEV_VERSION"
      - name: Build package
        run: python -m build
      - name: Publish development distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  pypi-publish:
    name: Publish release to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'release')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/terndata.ecoplots
    permissions:
      id-token: write
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Validate release tag
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::Provide release_tag when manually publishing a release."
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build packaging
      - name: Build package
        run: |
          python -m build
          python - <<'PYTHON'
          import os
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile
          from packaging.version import Version

          expected = Version(os.environ["RELEASE_TAG"])
          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("Expected exactly one built wheel.")
          with ZipFile(wheels[0]) as wheel:
              metadata = next(name for name in wheel.namelist() if name.endswith(".dist-info/METADATA"))
              actual = Version(BytesParser().parsebytes(wheel.read(metadata))["Version"])
          if actual != expected:
              raise SystemExit(f"Built version {actual} does not match release tag {expected}.")
          print(f"Verified release version {actual}")
          PYTHON
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
